name: Validate backport metadata
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate advisory records
        run: python3 scripts/validate_advisories.py
