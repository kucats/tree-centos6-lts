name: Non-publishing release readiness report
on:
  pull_request:
    paths:
      - "security/advisories/**"
      - "config/source-inventory.json"
      - "scripts/release_readiness.py"
      - "tests/test_release_readiness.py"
      - ".github/workflows/release-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test fail-closed release policy
        run: python3 -m unittest discover -s tests -v
      - name: Emit advisory/package blockers; never publish
        run: python3 scripts/release_readiness.py --output dist/release-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: centos6-release-BLOCKED-readiness-report
          path: dist/release-readiness.json
          retention-days: 7
